# Persistent storage for systemd-machined (machinectl)
# /var/lib/machines is on tmpfs in LibreELEC, redirect to persistent storage
# Ref: upstream systemd tmpfiles.d/systemd-nspawn.conf
# Type  Path                          Mode  User             Group            Age  Argument
Q /storage/.data/systemd-machines 0700 - - -
L+ /var/lib/machines - - - - /storage/.data/systemd-machines

# Create directory for nspawn runtime configurations
d /storage/.config/systemd-nspawn 0755 - - -

# Remove old temporary snapshots at boot (from upstream systemd-nspawn.conf)
R! /var/lib/machines/.#*
R! /.#machine.*
